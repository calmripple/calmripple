name: 3D Contrib

permissions:
  contents: write
  packages: write

on:
  schedule:
    - cron: 0 0 * * *
    # https://docs.github.com/zh/actions/using-workflows/events-that-trigger-workflows#schedule
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: yoshi389111/github-profile-3d-contrib@0c65111d31fe6b7c1c40b63bc307efc844fa4d2b # 0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: calmripple
      - name: Commit & Push
        run: |
          git config user.name calmripple
          git config user.email calmripple@dmsrs.org
          git add -A .
          git commit -m "generated"
          git push
