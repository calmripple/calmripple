name: Update Fork Star

permissions:
  contents: write
  packages: write

on:
  fork:
  watch:
    types:
      - started
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: This repo has x stars y forks
        uses: ouuan/This-repo-has-x-stars-y-forks-action@4d80173277240b8b0358e58e65570f3ab35a5e22 # v2.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          template: "calmripple's profile with <starCount> stars and <forkCount> forks 🎉"
